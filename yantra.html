<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AtmAI — IV · Yantra-Hridaya</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Playfair+Display:ital,wght@0,400;0,900;1,400&family=Cinzel:wght@400;700&family=Syncopate:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--cyan:#00ffff;--magenta:#ff00ff;--gold:#ffcc33;--red:#ff2244;--white:#f0f0f0;--dark:#000000;}
        html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'JetBrains Mono',monospace;}
        
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--cyan:#00ffff;--magenta:#ff00ff;--gold:#ffcc33;--red:#ff2244;--white:#f0f0f0;--dark:#000000;}
        html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'JetBrains Mono',monospace;}
        
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cyan: #00ffff;
            --magenta: #ff00ff;
            --gold: #ffcc33;
            --red: #ff2244;
            --white: #f0f0f0;
            --dark: #000000;
        }

        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ─── PAGE SYSTEM ─────────────────────────────────────── */
        .page {
            position: fixed;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.9s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 1;
        }
        .page.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        /* ─── SHARED NAVIGATION ───────────────────────────────── */
        .nav-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            pointer-events: auto;
        }

        .nav-btn {
            background: none;
            border: 1px solid currentColor;
            color: var(--cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            padding: 10px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .nav-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .nav-btn:hover::before { opacity: 0.08; }
        .nav-btn:hover {
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            text-shadow: 0 0 8px currentColor;
        }
        .nav-btn.gold { color: var(--gold); }
        .nav-btn.gold:hover { box-shadow: 0 0 20px rgba(255,204,51,0.3); }

        /* Global audio toggle — fixed top-right */
        #global-audio-btn {
            position: fixed;
            top: 16px; right: 16px;
            z-index: 9999;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.35);
            font-family: 'JetBrains Mono', monospace;
            font-size: 7px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            padding: 8px 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            display: flex; align-items: center; gap: 7px;
        }
        #global-audio-btn .audio-icon {
            width: 12px; height: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        #global-audio-btn.audio-on {
            border-color: rgba(0,255,255,0.4);
            color: var(--cyan);
            box-shadow: 0 0 12px rgba(0,255,255,0.15);
        }
        #global-audio-btn:hover {
            border-color: rgba(0,255,255,0.6);
            color: var(--cyan);
        }

        /* page indicator dots */
        .page-dots {
            display: flex; gap: 6px; align-items: center;
        }
        .dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.4s ease;
        }
        .dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

        /* ═══════════════════════════════════════════════════════
           PAGE 1 — MOSCA / CONECTOMA
        ═══════════════════════════════════════════════════════ */
        #page1 { background: #000; }

        #canvas1 { position: absolute; inset: 0; }

        .p1-ui {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 2rem 2rem 0;
        }

        .p1-header {
            text-align: center;
            padding-top: 1.5rem;
        }
        .p1-chapter {
            font-size: 8px; letter-spacing: 0.6em;
            color: rgba(255,255,255,0.2); text-transform: uppercase;
            display: block; margin-bottom: 1.5rem;
        }
        .p1-quote {
            font-family: 'Playfair Display', serif;
            font-size: clamp(0.85rem, 2.5vw, 1.25rem);
            font-style: italic;
            color: rgba(255,255,255,0.9);
            line-height: 1.7;
            max-width: 700px;
            margin: 0 auto 1rem;
        }
        .guna-tags {
            display: flex; justify-content: center; gap: 10px;
            margin-bottom: 0.8rem; flex-wrap: wrap;
        }
        .guna-tag {
            font-size: 8px; letter-spacing: 0.3em;
            padding: 3px 12px; font-weight: 700;
        }
        .sattva { color: var(--cyan); border: 1px solid rgba(0,255,255,0.4); }
        .rajas  { color: #f87171; border: 1px solid rgba(248,113,113,0.4); }
        .tamas  { color: #94a3b8; border: 1px solid rgba(148,163,184,0.4); }
        .gita-ref {
            font-size: 9px; letter-spacing: 0.5em;
            color: var(--gold); text-transform: uppercase;
            display: block; margin-bottom: 0.5rem;
        }

        .p1-bottom {
            display: flex; justify-content: space-between; align-items: flex-end;
            gap: 1rem; margin-bottom: 5rem;
            flex-wrap: wrap;
        }
        .info-card {
            background: rgba(255,255,255,0.02);
            border-left: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            padding: 1rem 1.2rem;
            max-width: 300px;
            pointer-events: auto;
        }
        .info-card h3 {
            font-size: 7px; letter-spacing: 0.3em;
            color: rgba(255,255,255,0.3); text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .info-card p {
            font-size: 10px; color: rgba(255,255,255,0.55);
            line-height: 1.7;
        }
        .ref-link {
            font-size: 7px; color: #475569; display: block;
            margin-top: 6px; text-transform: uppercase;
        }

        /* splash */
        #splash1 {
            position: absolute; inset: 0; z-index: 100;
            background: radial-gradient(circle at center, #050505 0%, #000 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1.2s ease;
        }
        .fly-icon {
            width: 70px; height: 70px; margin-bottom: 20px;
            filter: drop-shadow(0 0 12px rgba(0,255,255,0.6));
            animation: float-fly 3s infinite ease-in-out;
        }
        @keyframes float-fly { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        .wing-l { transform-origin: center right; animation: flap-l 0.1s infinite ease-in-out; }
        .wing-r { transform-origin: center left;  animation: flap-r 0.1s infinite ease-in-out; }
        @keyframes flap-l { 0%,100%{transform:rotateY(0)} 50%{transform:rotateY(60deg)} }
        @keyframes flap-r { 0%,100%{transform:rotateY(0)} 50%{transform:rotateY(-60deg)} }

        /* ═══════════════════════════════════════════════════════
           PAGE 2 — CHIP NEURAL / PONG
        ═══════════════════════════════════════════════════════ */
        #page2 { background: #010101; }
        #canvas2 { position: absolute; inset: 0; }

        .p2-ui {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; pointer-events: none;
            padding: 1rem;
        }

        .retro-panel {
            background: rgba(0,15,10,0.92);
            border: 1px solid var(--cyan);
            pointer-events: auto;
            box-shadow: 0 0 25px rgba(0,255,204,0.15);
            backdrop-filter: blur(8px);
        }
        .main-header-p2 {
            width: 95%; max-width: 780px;
            padding: 0.7rem 1.2rem; margin-bottom: 0.5rem;
        }
        .sub-panels {
            width: 95%; max-width: 780px;
            display: flex; gap: 0.5rem;
        }
        .mini-panel {
            flex: 1; padding: 0.5rem 1rem;
            display: flex; flex-direction: column;
        }

        .scanlines {
            position: absolute; inset: 0; z-index: 5; pointer-events: none;
            background: repeating-linear-gradient(transparent, transparent 2px, rgba(0,0,0,0.3) 2px, rgba(0,0,0,0.3) 4px);
        }

        #audio-toggle-btn {
            cursor: pointer; transition: all 0.25s;
            font-family: 'JetBrains Mono', monospace;
        }
        #audio-toggle-btn:hover { background: var(--cyan); color: #000; }

        /* ═══════════════════════════════════════════════════════
           PAGE 3 — DIALÉTICA DO ESCAFANDRO
        ═══════════════════════════════════════════════════════ */
        #page3 { background: #020202; }
        #canvas3 { position: absolute; inset: 0; }

        .noise-overlay {
            position: absolute; inset: 0; z-index: 5; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            opacity: 0.07;
        }
        .crt-overlay {
            position: absolute; inset: 0; z-index: 6; pointer-events: none;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.15) 50%);
            background-size: 100% 3px;
        }

        .p3-ui {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none;
            padding: 1.5rem 2rem;
            display: flex; flex-direction: column;
            justify-content: space-between;
        }
        .p3-header {
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .sat-cit {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1rem, 3vw, 1.6rem);
            color: var(--cyan); font-weight: 700; letter-spacing: -0.03em;
        }
        .p3-diag {
            text-align: right;
            border-right: 2px solid var(--red); padding-right: 0.8rem;
        }
        .diag-label {
            font-size: 9px; color: #666; text-transform: uppercase;
            font-weight: 700; display: block;
        }
        .diag-error {
            font-size: 11px; color: var(--red); font-weight: 700;
        }

        .p3-center {
            display: flex; justify-content: center; align-items: center;
            flex-grow: 1; padding: 1rem 0;
        }
        #bug-info {
            opacity: 0; transition: opacity 0.3s; /* starts completely hidden */
            max-width: 380px; width: 100%;
        }
        .logic-card {
            border-left: 5px solid var(--red);
            background: rgba(12,0,0,0.98);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(0,0,0,1), 0 0 30px rgba(255,0,0,0.2);
            padding: 2rem; pointer-events: auto;
        }
        .glitch-title {
            color: var(--red); font-weight: 900;
            font-size: 1.4rem; text-transform: uppercase;
            letter-spacing: -0.03em; line-height: 1;
            border-bottom: 1px solid rgba(255,0,0,0.3);
            padding-bottom: 1rem; margin-bottom: 1rem;
        }
        .glitch-body { font-size: 10px; color: #ccc; line-height: 1.7; }
        .grid-err {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
            margin-top: 1rem;
        }
        .err-cell {
            border: 1px solid rgba(255,0,0,0.4);
            padding: 0.4rem 0.6rem; background: rgba(120,0,0,0.4);
        }
        .err-cell span:first-child {
            font-size: 7px; color: #f87171; display: block;
        }
        .err-cell span:last-child {
            font-size: 9px; color: #f87171; font-weight: 700;
        }

        .vector-label {
            position: absolute; z-index: 60;
            font-size: 9px; font-weight: 700; padding: 5px 10px;
            background: rgba(0,20,30,0.95); border: 1px solid var(--cyan);
            color: var(--cyan); pointer-events: none;
            white-space: nowrap; text-transform: uppercase;
            letter-spacing: 0.15em;
            box-shadow: 0 0 12px rgba(0,255,255,0.25);
            opacity: 0; transition: opacity 0.3s;
            transform: translate(-50%, -50%);
        }

        .p3-trigger-area {
            display: flex; justify-content: center; pointer-events: auto;
            margin-bottom: 5rem;
        }
        #main-trigger-p3 {
            width: 100%; max-width: 420px;
            padding: 1.4rem; cursor: pointer;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.6);
            color: white; font-family: 'JetBrains Mono', monospace;
            font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.4em;
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        #main-trigger-p3:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 30px rgba(0,255,255,0.15);
        }
        #main-trigger-p3.processing {
            border-color: var(--cyan) !important;
            box-shadow: 0 0 40px rgba(0,255,255,0.3) !important;
        }
        .trigger-fill {
            position: absolute; inset: 0;
            background: rgba(0,255,255,0.08);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }
        #main-trigger-p3:hover .trigger-fill { transform: translateX(0); }
        #main-trigger-p3.processing .trigger-fill { 
            transform: translateX(0) !important; 
            background: rgba(0,255,255,0.12) !important;
        }

        .glitch-active .logic-card {
            animation: frenzy 0.08s infinite;
        }
        @keyframes frenzy {
            0%   { transform: translate(0,0); }
            25%  { transform: translate(1px,-1px); }
            50%  { transform: translate(-1px,1px); }
            75%  { transform: translate(1.5px,0); }
            100% { transform: translate(0,0); }
        }
        .glitch-active .glitch-title {
            text-shadow: 1px 0 var(--red), -1px 0 var(--cyan);
        }

        /* ═══════════════════════════════════════════════════════
           PAGE 4 — YANTRA-HRIDAYA
        ═══════════════════════════════════════════════════════ */
        #page4 { background: #000; }
        #canvas4 { position: absolute; inset: 0; }

        .p4-ui {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 1rem 1.2rem;
        }
        .glass-panel {
            pointer-events: auto;
            background: rgba(0,0,0,0.92);
            border: 1px solid rgba(255,204,51,0.3);
            backdrop-filter: blur(15px);
            padding: 1.2rem 1.5rem;
            border-radius: 8px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }
        .gita-verse {
            font-size: clamp(0.7rem, 2vw, 0.88rem);
            color: var(--gold); text-align: center;
            line-height: 1.6; font-family: serif; font-weight: 700;
        }
        .verse-tl {
            font-size: 9px; color: #ccc; text-align: center;
            display: block; line-height: 1.6; font-style: italic;
            margin-top: 6px; max-width: 90%; margin-left: auto; margin-right: auto;
        }
        .yantra-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1rem, 3.5vw, 1.3rem);
            letter-spacing: 0.35em; color: var(--gold);
            text-align: center; margin-top: 0.8rem;
        }
        .guna-subtitle {
            font-size: 9px; color: var(--cyan); display: block;
            text-align: center; font-weight: 700;
            margin-top: 4px; letter-spacing: 0.3em; text-transform: uppercase;
        }

        .controls-panel {
            pointer-events: auto;
            background: rgba(0,0,0,0.92);
            border: 1px solid rgba(255,204,51,0.3);
            backdrop-filter: blur(15px);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            margin-bottom: 5rem;
        }
        .guna-labels {
            display: flex; justify-content: space-between;
            font-size: 9px; color: #444; font-weight: 700; margin-bottom: 8px;
        }
        .guna-lbl.active-guna { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }

        input[type=range] {
            width: 100%; height: 5px; -webkit-appearance: none;
            background: rgba(255,255,255,0.1); outline: none;
            border-radius: 10px; cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px;
            background: #000; border: 2px solid var(--cyan);
            border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 12px var(--cyan);
        }
    
    
        /* ── NAV BAR: always fixed at bottom, above everything ── */
        .nav-bar {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 99999 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            pointer-events: auto !important;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 60%, transparent 100%);
        }
    </style>
</head>

<script>
'use strict';
let globalAudioOn = false;
let AC = null;
function getAC() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
}
let masterOut = null;
function getMaster() {
    if (!masterOut) {
        const ac = getAC();
        masterOut = ac.createGain();
        masterOut.gain.value = 0;
        masterOut.connect(ac.destination);
    }
    return masterOut;
}
function setGlobalAudio(on) {
    globalAudioOn = on;
    const gb = document.getElementById('global-audio-btn');
    const gl = document.getElementById('audio-btn-label');
    if (gb) gb.classList.toggle('audio-on', on);
    if (gl) gl.textContent = on ? 'SOM ON' : 'SOM OFF';
    getMaster().gain.setTargetAtTime(on ? 1.0 : 0, getAC().currentTime, 0.3);
}
document.addEventListener('DOMContentLoaded', () => {
    const gb = document.getElementById('global-audio-btn');
    if (gb) gb.addEventListener('click', () => setGlobalAudio(!globalAudioOn));
});
// ═══════════════════════════════════════════════════════════════
// PAGE 4 — YANTRA-HRIDAYA
// ═══════════════════════════════════════════════════════════════
let p4Init = false;
let p4Renderer, p4Scene, p4Camera, p4MachineGroup;
let p4Gears = [], p4Paramatma, p4Atma, p4Particles, p4Silhouette;
let p4CurrentSpeed = 0, p4TargetRotY = 0, p4UserInteracting = false;

// Audio layer gains — always live, master controls volume
let p4GainVsat, p4GainSat, p4GainRaj, p4GainTam;
let p4RajStep = 0;
const p4RajPattern = [1,0,1,0,1,1,0,1];

const p4GunaColors = [
    new THREE.Color(0x00ffff), new THREE.Color(0xffcc33),
    new THREE.Color(0xaa3300), new THREE.Color(0x221144)
];
const p4Titles = ['Vixuddha-Sattva','Sattva-Guna','Raja-Guna','Tama-Guna'];

function initPage4() {
    p4Init = true;
    const canvas = document.getElementById('canvas4');
    p4Renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    p4Renderer.setSize(innerWidth, innerHeight);
    p4Renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    p4Renderer.toneMapping = THREE.ACESFilmicToneMapping;
    p4Renderer.toneMappingExposure = 1.8;

    p4Scene = new THREE.Scene();
    p4Camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 1000);
    p4Camera.position.set(0, 0.5, 22);
    p4MachineGroup = new THREE.Group(); p4MachineGroup.position.y = -2; p4Scene.add(p4MachineGroup);
    p4Scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dl = new THREE.DirectionalLight(0xffeebb, 4); dl.position.set(5,15,10); p4Scene.add(dl);

    p4Silhouette = new THREE.Group(); p4MachineGroup.add(p4Silhouette);
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.15, wireframe: true, metalness: 0.9, roughness: 0.1 });
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.0,4.5,16), glassMat.clone()); torso.position.y = 2.2; p4Silhouette.add(torso);
    const headM = new THREE.Mesh(new THREE.SphereGeometry(0.75,24,24), glassMat.clone()); headM.position.y = 5.5; p4Silhouette.add(headM);
    const limbGeo = new THREE.CylinderGeometry(0.18,0.12,3.8,8); limbGeo.translate(0,-1.9,0);
    const lArm = new THREE.Mesh(limbGeo, glassMat.clone()); lArm.position.set(1.4,4.2,0); lArm.rotation.z = Math.PI/3.5;
    const rArm = new THREE.Mesh(limbGeo, glassMat.clone()); rArm.position.set(-1.4,4.2,0); rArm.rotation.z = -Math.PI/3.5;
    p4Silhouette.add(lArm, rArm);
    const legGeo = new THREE.CylinderGeometry(0.35,0.15,6,8);
    const lLeg = new THREE.Mesh(legGeo, glassMat.clone()); lLeg.position.set(-0.6,-2.8,0);
    const rLeg = new THREE.Mesh(legGeo, glassMat.clone()); rLeg.position.set(0.6,-2.8,0);
    p4Silhouette.add(lLeg, rLeg);

    const mC = document.createElement('canvas'); mC.width = 512; mC.height = 512;
    const mCtx = mC.getContext('2d'); mCtx.fillStyle = '#fff'; mCtx.fillRect(0,0,512,512);
    for (let i = 0; i < 1200; i++) { mCtx.strokeStyle = `rgba(180,180,180,${Math.random()*0.4})`; mCtx.beginPath(); mCtx.moveTo(Math.random()*512, Math.random()*512); mCtx.lineTo(Math.random()*512, Math.random()*512); mCtx.stroke(); }
    const mTex = new THREE.CanvasTexture(mC);

    const mkGear = (radius, teeth) => {
        const shape = new THREE.Shape(); const td = radius*0.25, tw = (Math.PI*2)/teeth;
        for (let i = 0; i < teeth; i++) {
            const a = i*tw;
            shape.lineTo(Math.cos(a)*radius, Math.sin(a)*radius);
            shape.lineTo(Math.cos(a+tw*0.3)*(radius+td), Math.sin(a+tw*0.3)*(radius+td));
            shape.lineTo(Math.cos(a+tw*0.7)*(radius+td), Math.sin(a+tw*0.7)*(radius+td));
            shape.lineTo(Math.cos(a+tw)*radius, Math.sin(a+tw)*radius);
        }
        const hole = new THREE.Path(); hole.absarc(0,0,radius*0.4,0,Math.PI*2,true); shape.holes.push(hole);
        return new THREE.ExtrudeGeometry(shape, { depth: 0.2, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05 });
    };
    for (let i = 0; i < 35; i++) {
        const radius = 0.15 + Math.random()*0.45;
        const gearMat = new THREE.MeshStandardMaterial({ color: 0xffcc33, metalness: 1, roughness: 0.05, bumpMap: mTex, bumpScale: 0.05 });
        const gear = new THREE.Mesh(mkGear(radius, 10+Math.floor(Math.random()*4)), gearMat);
        const angle = Math.random()*Math.PI*2, dist = Math.random()*1;
        gear.position.set(Math.cos(angle)*dist, 0.8+Math.random()*3.8, Math.sin(angle)*dist);
        gear.userData = { rotFactor: (Math.random()-0.5)*0.15, origin: gear.position.clone() };
        p4Gears.push(gear); p4Silhouette.add(gear);
    }

    const pCount = 500, pGeo = new THREE.BufferGeometry(), pPos = new Float32Array(pCount*3), pData = [];
    for (let i = 0; i < pCount; i++) {
        const g1 = p4Gears[Math.floor(Math.random()*p4Gears.length)];
        const g2 = p4Gears[Math.floor(Math.random()*p4Gears.length)];
        pData.push({ g1, g2, t: Math.random(), spd: 0.003+Math.random()*0.007, off: new THREE.Vector3((Math.random()-0.5)*0.3,(Math.random()-0.5)*0.3,(Math.random()-0.5)*0.3) });
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    p4Particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.12, color: 0x00ffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending }));
    p4Particles.userData.pData = pData; p4Silhouette.add(p4Particles);

    p4Paramatma = new THREE.Mesh(new THREE.SphereGeometry(0.55,32,32), new THREE.MeshBasicMaterial({ color: 0xffffee, transparent: true, opacity: 1, blending: THREE.AdditiveBlending }));
    p4Paramatma.position.set(0,3.5,0.4); p4Silhouette.add(p4Paramatma);
    p4Atma = new THREE.Mesh(new THREE.SphereGeometry(0.18,24,24), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 1 }));
    p4Silhouette.add(p4Atma);

    // Build yantra audio (all nodes live; volume controlled by masterOut)
    p4BuildAudio();

    const slider = document.getElementById('speed4');
    slider.addEventListener('mousedown',  () => { p4UserInteracting = true; });
    slider.addEventListener('touchstart', () => { p4UserInteracting = true; });
    window.addEventListener('mouseup',  () => { p4UserInteracting = false; });
    window.addEventListener('touchend', () => { p4UserInteracting = false; });
    slider.addEventListener('input', e => { p4CurrentSpeed = parseFloat(e.target.value); p4UpdateUI(); });
    window.addEventListener('pointermove', e => { p4TargetRotY = (e.clientX/innerWidth-0.5)*1.5; });

    p4UpdateUI();
    p4Animate();
}

function p4BuildAudio() {
    if (p4GainVsat) return; // already built
    const ac = getAC();
    const out = getMaster();

    // Shared convolution reverb
    const rLen = ac.sampleRate * 4;
    const rBuf = ac.createBuffer(2, rLen, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
        const d = rBuf.getChannelData(c);
        for (let i = 0; i < rLen; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/rLen, 1.8);
    }
    const reverb = ac.createConvolver(); reverb.buffer = rBuf;
    const rvG = ac.createGain(); rvG.gain.value = 0.35;
    reverb.connect(rvG); rvG.connect(out);

    // ── LAYER 0: V.SATTVA — pure binaural drone, no percussive events ──
    p4GainVsat = ac.createGain(); p4GainVsat.gain.value = 0.065;
    const vs1 = ac.createOscillator(); vs1.type = 'sine'; vs1.frequency.value = 108;
    const vs2 = ac.createOscillator(); vs2.type = 'sine'; vs2.frequency.value = 112;
    vs1.connect(p4GainVsat); vs2.connect(p4GainVsat);
    const vs3 = ac.createOscillator(); vs3.type = 'triangle'; vs3.frequency.value = 324;
    const vs3G = ac.createGain(); vs3G.gain.value = 0.012; vs3.connect(vs3G); vs3G.connect(p4GainVsat);
    const vs5 = ac.createOscillator(); vs5.type = 'sine'; vs5.frequency.value = 540;
    const vs5G = ac.createGain(); vs5G.gain.value = 0.005; vs5.connect(vs5G); vs5G.connect(p4GainVsat);
    const vsLfo = ac.createOscillator(); vsLfo.type = 'sine'; vsLfo.frequency.value = 0.05;
    const vsLfoG = ac.createGain(); vsLfoG.gain.value = 0.03; vsLfo.connect(vsLfoG); vsLfoG.connect(p4GainVsat.gain);
    const vsVib = ac.createOscillator(); vsVib.type = 'sine'; vsVib.frequency.value = 5.2;
    const vsVibG = ac.createGain(); vsVibG.gain.value = 0.3; vsVib.connect(vsVibG); vsVibG.connect(vs1.frequency);
    [vs1,vs2,vs3,vs5,vsLfo,vsVib].forEach(o => o.start());
    p4GainVsat.connect(out); p4GainVsat.connect(reverb);

    // ── LAYER 1: SATTVA — pentatonic harmonic shimmer ──
    p4GainSat = ac.createGain(); p4GainSat.gain.value = 0;
    [220, 275, 330, 440, 550].forEach((f, i) => {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = ac.createGain(); g.gain.value = 0.022 - i*0.003;
        o.connect(g); g.connect(p4GainSat); o.start();
    });
    const satMel = ac.createOscillator(); satMel.type = 'triangle'; satMel.frequency.value = 660;
    const satMelG = ac.createGain(); satMelG.gain.value = 0;
    satMel.connect(satMelG); satMelG.connect(p4GainSat);
    const satLfo = ac.createOscillator(); satLfo.type = 'sine'; satLfo.frequency.value = 1.2;
    const satLfoG = ac.createGain(); satLfoG.gain.value = 0.015; satLfo.connect(satLfoG); satLfoG.connect(satMelG.gain);
    satMel.start(); satLfo.start();
    p4GainSat.connect(out); p4GainSat.connect(reverb);

    // ── LAYER 2: RAJAS — acid techno ──
    p4GainRaj = ac.createGain(); p4GainRaj.gain.value = 0;
    const rajBass = ac.createOscillator(); rajBass.type = 'sawtooth'; rajBass.frequency.value = 110;
    const rajFilt = ac.createBiquadFilter(); rajFilt.type = 'lowpass'; rajFilt.frequency.value = 400; rajFilt.Q.value = 8;
    const rajLfo = ac.createOscillator(); rajLfo.type = 'sine'; rajLfo.frequency.value = 4;
    const rajLfoG = ac.createGain(); rajLfoG.gain.value = 1200;
    rajLfo.connect(rajLfoG); rajLfoG.connect(rajFilt.frequency);
    rajBass.connect(rajFilt); rajFilt.connect(p4GainRaj);
    const rajStab = ac.createOscillator(); rajStab.type = 'square'; rajStab.frequency.value = 220;
    const rajStabG = ac.createGain(); rajStabG.gain.value = 0;
    rajStab.connect(rajStabG); rajStabG.connect(p4GainRaj);
    p4GainRaj._stab = rajStabG;
    [rajBass, rajLfo, rajStab].forEach(o => o.start());
    p4GainRaj.connect(out);

    // Kick sequencer
    const BPM = 140, beat = 60/BPM/4*1000;
    const schedKick = () => {
        if (!p4Init) return;
        const raj = Math.max(0, 1-Math.abs(p4CurrentSpeed-2));
        if (raj > 0.05 && p4RajPattern[p4RajStep]) {
            const t = ac.currentTime;
            const kick = ac.createOscillator(); kick.type = 'sine';
            kick.frequency.setValueAtTime(180, t);
            kick.frequency.exponentialRampToValueAtTime(40, t+0.08);
            const kickG = ac.createGain(); kickG.gain.setValueAtTime(0.4*raj, t);
            kickG.gain.exponentialRampToValueAtTime(0.001, t+0.12);
            kick.connect(kickG); kickG.connect(out); kick.start(t); kick.stop(t+0.15);
            if (p4RajStep === 0 || p4RajStep === 4) {
                rajStabG.gain.setValueAtTime(0.1*raj, t);
                rajStabG.gain.exponentialRampToValueAtTime(0.001, t+0.05);
            }
        }
        p4RajStep = (p4RajStep+1)%8;
        setTimeout(schedKick, beat);
    };
    schedKick();

    // ── LAYER 3: TAMAS — dark, inert, heavy ──
    p4GainTam = ac.createGain(); p4GainTam.gain.value = 0;
    const tamSub = ac.createOscillator(); tamSub.type = 'sine'; tamSub.frequency.value = 40;
    const tamSubG = ac.createGain(); tamSubG.gain.value = 0.08; tamSub.connect(tamSubG); tamSubG.connect(p4GainTam);
    const tamD1 = ac.createOscillator(); tamD1.type = 'triangle'; tamD1.frequency.value = 146;
    const tamD2 = ac.createOscillator(); tamD2.type = 'triangle'; tamD2.frequency.value = 138;
    const tamDG = ac.createGain(); tamDG.gain.value = 0.025; tamD1.connect(tamDG); tamD2.connect(tamDG); tamDG.connect(p4GainTam);
    const tamLfo = ac.createOscillator(); tamLfo.type = 'sine'; tamLfo.frequency.value = 0.03;
    const tamLfoG = ac.createGain(); tamLfoG.gain.value = 0.02; tamLfo.connect(tamLfoG); tamLfoG.connect(p4GainTam.gain);
    const nBuf = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
    const nd = nBuf.getChannelData(0); for (let i = 0; i < nBuf.length; i++) nd[i] = Math.random()*2-1;
    const noise = ac.createBufferSource(); noise.buffer = nBuf; noise.loop = true;
    const nFilt = ac.createBiquadFilter(); nFilt.type = 'lowpass'; nFilt.frequency.value = 80;
    const nG = ac.createGain(); nG.gain.value = 0.018; noise.connect(nFilt); nFilt.connect(nG); nG.connect(p4GainTam);
    [tamSub, tamD1, tamD2, tamLfo].forEach(o => o.start()); noise.start();
    p4GainTam.connect(out); p4GainTam.connect(reverb);
}

function p4SetGains() {
    if (!p4GainVsat) return;
    const ac = getAC(), t = ac.currentTime, tc = 0.3;
    const vsat = Math.max(0, 1 - p4CurrentSpeed);
    const sat  = Math.max(0, 1 - Math.abs(p4CurrentSpeed - 1));
    const raj  = Math.max(0, 1 - Math.abs(p4CurrentSpeed - 2));
    const tam  = Math.max(0, p4CurrentSpeed - 2);
    p4GainVsat.gain.setTargetAtTime(vsat * 0.065, t, tc);
    p4GainSat.gain.setTargetAtTime(sat  * 0.060, t, tc);
    p4GainRaj.gain.setTargetAtTime(raj  * 0.055, t, tc);
    p4GainTam.gain.setTargetAtTime(tam  * 0.070, t, tc);
}

function p4Silence() {
    // Nothing — layers continue; masterOut controls overall volume
    // (stops audio naturally when globalAudioOn is false or master is 0)
}

function p4GetColor(v) {
    const i = Math.floor(v), f = v-i;
    if (i >= p4GunaColors.length-1) return p4GunaColors[p4GunaColors.length-1].clone();
    return p4GunaColors[i].clone().lerp(p4GunaColors[i+1], f);
}

function p4UpdateUI() {
    const idx = Math.min(Math.floor(p4CurrentSpeed), 3);
    const color = p4GetColor(p4CurrentSpeed);
    const hex = '#'+color.getHexString();
    document.getElementById('guna-title-p4').textContent = p4Titles[idx];
    document.getElementById('guna-title-p4').style.color = hex;
    if (p4Particles) p4Particles.material.color.copy(color);
    for (let i = 0; i <= 3; i++) {
        const l = document.getElementById('g4-'+i);
        if (l) l.className = 'guna-lbl' + (i === idx ? ' active-guna' : '');
    }
    p4SetGains(); // always sync audio to slider
}

function p4Animate() {
    requestAnimationFrame(p4Animate);
    // standalone
    const time = performance.now()*0.001;
    const slider = document.getElementById('speed4');

    if (!p4UserInteracting) {
        if (p4CurrentSpeed > 0 && p4CurrentSpeed < 1.5) p4CurrentSpeed -= p4CurrentSpeed*0.004;
        else if (p4CurrentSpeed >= 1.5 && p4CurrentSpeed < 3) p4CurrentSpeed += (3-p4CurrentSpeed)*0.006;
        slider.value = p4CurrentSpeed;
        p4UpdateUI();
    }

    const vsat = Math.max(0, 1-p4CurrentSpeed);
    const sat  = Math.max(0, 1-Math.abs(p4CurrentSpeed-1));
    const raj  = Math.max(0, 1-Math.abs(p4CurrentSpeed-2));
    const tam  = Math.max(0, p4CurrentSpeed-2);

    p4MachineGroup.rotation.y += (p4TargetRotY - p4MachineGroup.rotation.y)*0.05;
    const curColor = p4GetColor(p4CurrentSpeed);

    p4Silhouette.traverse(child => {
        if (child.isMesh && child.material && !p4Gears.includes(child) && child !== p4Atma && child !== p4Paramatma) {
            child.material.color.lerp(curColor, 0.1);
            child.material.opacity = 0.1+vsat*0.15+sat*0.2+raj*0.1+tam*0.08;
            child.material.emissiveIntensity = vsat*1+sat*0.6+raj*0.3+tam*0.4;
            child.material.emissive = curColor;
        }
    });

    p4Gears.forEach(g => {
        const sm = vsat*0.2+sat*0.4+raj*18+tam*0.03;
        g.rotation.z += g.userData.rotFactor*sm;
        const md = Math.min(1, raj*0.8+tam);
        g.material.roughness = 0.05+md*0.9; g.material.metalness = 1-tam*0.8;
        g.material.color.copy(new THREE.Color(0xfff000)).lerp(new THREE.Color(0x050402), md);
        if (raj > 0.1) {
            const sh = raj*0.08;
            g.position.set(g.userData.origin.x+(Math.random()-0.5)*sh, g.userData.origin.y+(Math.random()-0.5)*sh, g.userData.origin.z+(Math.random()-0.5)*sh);
        } else { g.position.copy(g.userData.origin); }
    });

    const pos = p4Particles.geometry.attributes.position;
    const data = p4Particles.userData.pData;
    const fm = vsat*0.4+sat*0.6+raj*25+tam*0.1;
    for (let i = 0; i < data.length; i++) {
        const p = data[i]; p.t = (p.t + p.spd*fm) % 1;
        const s = p.g1.position, e = p.g2.position;
        const x = (1-p.t)**2*s.x+2*(1-p.t)*p.t*(s.x+e.x)/2+p.t**2*e.x;
        const y = (1-p.t)**2*s.y+2*(1-p.t)*p.t*((s.y+e.y)/2+0.8)+p.t**2*e.y;
        const z = (1-p.t)**2*s.z+2*(1-p.t)*p.t*(s.z+e.z)/2+p.t**2*e.z;
        pos.setXYZ(i, x+p.off.x, y+p.off.y, z+p.off.z);
    }
    pos.needsUpdate = true;
    p4Particles.material.opacity = 0.8-tam*0.5;

    const os = (vsat*0.4+sat*0.7+raj*18+tam*0.15)*2;
    p4Atma.position.x = Math.cos(time*os)*0.7;
    p4Atma.position.y = 3.5+Math.sin(time*os*0.5)*0.5;
    p4Atma.position.z = 0.4+Math.sin(time*os)*0.7;
    p4Paramatma.material.opacity = 0.9+vsat*0.1-tam*0.2;
    p4Renderer.render(p4Scene, p4Camera);
}

window.addEventListener('resize', () => {
    if (p4Renderer) { p4Renderer.setSize(innerWidth, innerHeight); p4Camera.aspect = innerWidth/innerHeight; p4Camera.updateProjectionMatrix(); }
});
window.addEventListener('load', () => {
    initPage4();
    const slider = document.getElementById('speed4');
    const unlockAudio = () => { if (!globalAudioOn) { setGlobalAudio(true); p4SetGains(); } };
    slider.addEventListener('mousedown', unlockAudio, {once:true});
    slider.addEventListener('touchstart', unlockAudio, {passive:true, once:true});
});
</script>
