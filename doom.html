<div id="hud">
    <button class="nav-btn" id="btn-voltar" onclick="window.history.back()">VOLTAR</button>
    <div class="center-stats">
        <div class="stat-box">
            <div class="stat-label">SINAPSE</div>
            <div class="stat-value" id="hp">100%</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">AMOSTRAS</div>
            <div class="stat-value" id="kills">0</div>
        </div>
    </div>
    <button class="nav-btn" id="btn-avancar" onclick="proximaFase()">AVANÇAR</button>
</div>

<script>
    // Adicione esta função para o botão Avançar
    function proximaFase() {
        if (score >= 10) {
            alert("Acesso concedido ao Nível 2!");
            // location.href = "fase2.html"; 
        } else {
            alert("Amostras insuficientes (Mínimo: 10)");
        }
    }

    // Melhorei a função de redimensionamento para evitar quebras
    window.addEventListener('resize', () => {
        if (!camera || !renderer) return;
        camera.aspect = window.innerWidth / (window.innerHeight - 100);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight - 100);
    });

    // Mantenha o resto do seu código de inicialização...
</script>
