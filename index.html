<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AtmAI — Sequência Ontológica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Playfair+Display:ital,wght@0,400;0,900;1,400&family=Cinzel:wght@400;700&family=Syncopate:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* CSS RESET & VARS */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --cyan: #00ffff; --magenta: #ff00ff; --gold: #ffcc33; --red: #ff2244; --dark: #000; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'JetBrains Mono', monospace; color: #fff; }

        /* NAVEGAÇÃO GLOBAL */
        .page { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.8s ease; z-index: 1; }
        .page.active { opacity: 1; pointer-events: auto; z-index: 2; }
        
        .nav-bar { position: absolute; bottom: 20px; left: 0; right: 0; z-index: 100; display: flex; justify-content: center; gap: 15px; }
        .nav-btn { background: none; border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 20px; cursor: pointer; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; }
        .nav-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

        /* UI ESPECÍFICA P3 (A MÁGICA DO IMPACTO) */
        .p3-center { 
            position: absolute; inset: 0; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: all 1s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        .p3-center.pushed-down { justify-content: flex-start; padding-top: 5vh; }
        
        #bug-info { 
            opacity: 0; transform: translateY(-50px); transition: 0.8s ease; 
            max-width: 400px; margin-bottom: 20px; pointer-events: none;
        }
        #bug-info.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .logic-card { border-left: 4px solid var(--red); background: rgba(15,0,0,0.9); padding: 20px; box-shadow: 0 0 30px rgba(255,0,0,0.2); }
        .glitch-title { color: var(--red); font-size: 1.2rem; margin-bottom: 10px; }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    </style>
</head>
<body>

<div id="page1" class="page active">
    <canvas id="canvas1"></canvas>
    <div style="position:relative; z-index:10; text-align:center; padding-top:10vh;">
        <h2 style="letter-spacing:10px; color:var(--cyan)">PRAKRITI</h2>
        <p style="font-family:'Playfair Display'; font-style:italic; opacity:0.7">O Conectoma Material</p>
    </div>
    <div class="nav-bar">
        <button class="nav-btn" onclick="goTo(2)">PRÓXIMO →</button>
    </div>
</div>

<div id="page2" class="page">
    <canvas id="canvas2"></canvas>
    <div class="nav-bar">
        <button class="nav-btn" onclick="goTo(1)">← VOLTAR</button>
        <button class="nav-btn" onclick="goTo(3)">PRÓXIMO →</button>
    </div>
</div>

<div id="page3" class="page">
    <canvas id="canvas3"></canvas>
    <div class="p3-center" id="p3-container">
        <div id="bug-info">
            <div class="logic-card">
                <h2 class="glitch-title">FRUSTRAÇÃO DETECTADA</h2>
                <p style="font-size:11px; line-height:1.6">O Escafandro tenta processar o Infinito, mas o hardware é finito. Ruído ontológico detectado na rede.</p>
            </div>
        </div>
        </div>
    <div class="nav-bar">
        <button class="nav-btn" onclick="goTo(2)">← VOLTAR</button>
        <button class="nav-btn" id="trigger-impact" style="border-color:var(--red); color:var(--red)">EXECUTAR IMPACTO</button>
        <button class="nav-btn" onclick="goTo(4)">FINAL →</button>
    </div>
</div>

<div id="page4" class="page">
    <canvas id="canvas4"></canvas>
    <div class="nav-bar">
        <button class="nav-btn" onclick="goTo(3)">← VOLTAR</button>
        <button class="nav-btn" onclick="goTo(1)" style="color:var(--gold); border-color:var(--gold)">REINICIAR</button>
    </div>
</div>

<script>
    // SISTEMA DE NAVEGAÇÃO
    let currentPage = 1;
    function goTo(n) {
        document.querySelector(`#page${currentPage}`).classList.remove('active');
        document.querySelector(`#page${n}`).classList.add('active');
        currentPage = n;
    }

    // LÓGICA DE IMPACTO DA P3
    document.getElementById('trigger-impact').addEventListener('click', function() {
        document.getElementById('p3-container').classList.add('pushed-down');
        document.getElementById('bug-info').classList.add('visible');
        this.innerText = "SISTEMA SOBRECARREGADO";
    });

    // --- RENDERIZADORES THREE.JS (O QUE FAZ OS ELEMENTOS APARECEREM) ---
    
    function initScene(canvasId, color) {
        const canvas = document.getElementById(canvasId);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        return { scene, camera, renderer };
    }

    // Cena 1: Partículas (Conectoma)
    const p1 = initScene('canvas1');
    const geo1 = new THREE.TorusKnotGeometry(10, 3, 100, 16);
    const mat1 = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.3 });
    const mesh1 = new THREE.Mesh(geo1, mat1);
    p1.scene.add(mesh1);
    p1.camera.position.z = 30;

    // Cena 2: Cubo Neural
    const p2 = initScene('canvas2');
    const geo2 = new THREE.BoxGeometry(10, 10, 10);
    const mat2 = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
    const mesh2 = new THREE.Mesh(geo2, mat2);
    p2.scene.add(mesh2);
    p2.camera.position.z = 25;

    // Cena 3: Escafandro (Representado por uma esfera técnica)
    const p3 = initScene('canvas3');
    const geo3 = new THREE.SphereGeometry(8, 32, 32);
    const mat3 = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
    const mesh3 = new THREE.Mesh(geo3, mat3);
    p3.scene.add(mesh3);
    p3.camera.position.z = 30;

    // Cena 4: Mandala (Yantra)
    const p4 = initScene('canvas4');
    const geo4 = new THREE.OctahedronGeometry(10, 0);
    const mat4 = new THREE.MeshBasicMaterial({ color: 0xffcc33, wireframe: true });
    const mesh4 = new THREE.Mesh(geo4, mat4);
    p4.scene.add(mesh4);
    p4.camera.position.z = 25;

    function animate() {
        requestAnimationFrame(animate);
        mesh1.rotation.y += 0.005;
        mesh2.rotation.x += 0.01;
        mesh3.rotation.y += 0.002;
        mesh4.rotation.z += 0.01;
        
        if(currentPage === 1) p1.renderer.render(p1.scene, p1.camera);
        if(currentPage === 2) p2.renderer.render(p2.scene, p2.camera);
        if(currentPage === 3) p3.renderer.render(p3.scene, p3.camera);
        if(currentPage === 4) p4.renderer.render(p4.scene, p4.camera);
    }
    animate();

    window.addEventListener('resize', () => {
        // Ajuste de câmera básico para todos
        [p1, p2, p3, p4].forEach(p => {
            p.camera.aspect = window.innerWidth / window.innerHeight;
            p.camera.updateProjectionMatrix();
            p.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    });
</script>
</body>
</html>
