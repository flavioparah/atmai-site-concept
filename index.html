<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmai Site Concept</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Add escafandro-down CSS transition rule */
        #canvas3 {
            transition: transform 0.5s ease-in-out;
        }
        .escafandro-down {
            transform: translateY(100px); /* Adjust to desired descent distance */
        }
    </style>
</head>
<body>
    <div id="page3" class="page">
        <canvas id="canvas3"></canvas>
        <script>
            // Initial position of p3Astronaut changed from -3 to 2
            let p3Astronaut = 2;

            // Update trigger event listeners to toggle the escafandro-down class
            const triggerButton = document.getElementById('triggerButton');
            triggerButton.addEventListener('click', function() {
                const page3Element = document.getElementById('page3');
                page3Element.classList.toggle('escafandro-down');
            });
        </script>
    </div>
</body>
</html>
